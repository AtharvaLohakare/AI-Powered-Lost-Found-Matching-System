<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Messages | Lost & Found AI</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .messages-section {

            max-width: 900px;

            margin: 40px auto;

            padding: 20px;

        }


        .message-container {

            background: white;

            border-radius: 15px;

            padding: 25px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.08);

        }


        .message-header {

            border-bottom:
                1px solid #e5e7eb;

            padding-bottom: 15px;

            margin-bottom: 20px;

        }


        .message-header h1 {

            margin-bottom: 5px;

        }


        .message-header p {

            color: #666;

        }


        #conversation {

            min-height: 300px;

            max-height: 500px;

            overflow-y: auto;

            padding: 10px;

        }


        .message {

            max-width: 70%;

            padding: 12px 16px;

            margin: 10px 0;

            border-radius: 15px;

            line-height: 1.5;

        }


        .message.sent {

            margin-left: auto;

            background: #2563eb;

            color: white;

            border-bottom-right-radius: 4px;

        }


        .message.received {

            margin-right: auto;

            background: #f1f5f9;

            color: #222;

            border-bottom-left-radius: 4px;

        }


        .message-name {

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 4px;

        }


        .message-time {

            font-size: 10px;

            opacity: 0.7;

            margin-top: 5px;

        }


        .message-form {

            display: flex;

            gap: 10px;

            margin-top: 20px;

            border-top:
                1px solid #e5e7eb;

            padding-top: 20px;

        }


        .message-form textarea {

            flex: 1;

            min-height: 55px;

            resize: vertical;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            font-family: inherit;

        }


        .message-form button {

            border: none;

            border-radius: 10px;

            padding: 0 22px;

            cursor: pointer;

            background: #2563eb;

            color: white;

            font-weight: 600;

        }


        .message-form button:hover {

            opacity: 0.9;

        }


        .empty-messages {

            text-align: center;

            padding: 80px 20px;

            color: #777;

        }


        .back-btn {

            display: inline-block;

            margin-bottom: 20px;

            text-decoration: none;

            color: #2563eb;

            font-weight: 600;

        }


        @media (max-width: 600px) {

            .messages-section {

                margin: 20px auto;

                padding: 10px;

            }


            .message {

                max-width: 85%;

            }


            .message-form {

                flex-direction: column;

            }


            .message-form button {

                padding: 12px;

            }

        }

    </style>

</head>


<body>


    <!-- ================================================= -->
    <!-- NAVBAR -->
    <!-- ================================================= -->

    <nav class="navbar">

        <div class="logo">
            Lost & Found AI
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="items.html">
                Items
            </a>

            <a href="report-lost.html">
                Report Lost
            </a>

            <a href="report-found.html">
                Report Found
            </a>

        </div>


        <div class="nav-buttons">

            <a
                href="login.html"
                class="login-btn"
            >
                Login
            </a>

            <a
                href="signup.html"
                class="signup-btn"
            >
                Sign Up
            </a>

        </div>

    </nav>


    <!-- ================================================= -->
    <!-- MESSAGES -->
    <!-- ================================================= -->

    <section class="messages-section">

        <a
            href="javascript:history.back()"
            class="back-btn"
        >
            ← Back
        </a>


        <div class="message-container">


            <div class="message-header">

                <h1>
                    💬 Communication
                </h1>

                <p id="item-info">
                    Loading conversation...
                </p>

            </div>


            <div id="conversation">

                <div class="empty-messages">
                    Loading messages...
                </div>

            </div>


            <form
                id="messageForm"
                class="message-form"
            >

                <textarea
                    id="messageInput"
                    placeholder="Type your message..."
                    required
                ></textarea>


                <button type="submit">
                    Send
                </button>

            </form>


        </div>

    </section>


    <script src="config.js"></script>

    <script src="script.js"></script>

    <script src="messages.js"></script>

<script>

    const navButtons =
        document.querySelector(".nav-buttons");

    const storedUser =
        localStorage.getItem("user");


    if (
        storedUser &&
        navButtons
    ) {

        try {

            const user =
                JSON.parse(storedUser);


            if (
                user &&
                user.id
            ) {

                navButtons.innerHTML = `

                    <span class="user-welcome">

                        Hi, ${user.name} 👋

                    </span>


                    <a
                        href="my-reports.html"
                        class="login-btn"
                    >

                        My Reports

                    </a>


                    <a
                        href="#"
                        class="signup-btn"
                        id="logoutBtn"
                    >

                        Logout

                    </a>

                `;


                document
                    .getElementById("logoutBtn")
                    .addEventListener(
                        "click",
                        function(event) {

                            event.preventDefault();

                            localStorage.removeItem(
                                "user"
                            );

                            window.location.href =
                                "index.html";

                        }
                    );

            }

        }
        catch (error) {

            console.error(
                "Invalid user data:",
                error
            );

            localStorage.removeItem(
                "user"
            );

        }

    }

</script>
</body>

</html>
