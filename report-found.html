<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Found Item | Lost & Found AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">Lost & Found AI</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="items.html">Items</a>
            <a href="report-lost.html">Report Lost</a>
            <a href="report-found.html">Report Found</a>
<a href="community.html">
    Community
</a>
        </div>

        <div class="nav-buttons">
            <a href="login.html" class="login-btn">Login</a>
            <a href="signup.html" class="signup-btn">Sign Up</a>
        </div>

    </nav>


    <section class="form-section">

        <div class="form-container">

            <h1>Report a Found Item</h1>

            <p class="form-description">
                Enter the details of the item you found to help identify its owner.
            </p>


            <form id="found-item-form">

                <div class="form-group">

                    <label>Item Name</label>

                    <input
                        type="text"
                        name="item_name"
                        placeholder="e.g. Black Backpack"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Category</label>

                    <select name="category" required>

                        <option value="">Select Category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Bags">Bags</option>
                        <option value="Documents">Documents</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Other">Other</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Description</label>

                    <textarea
                        name="description"
                        placeholder="Describe the item you found..."
                        rows="5"
                        required
                    ></textarea>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>Color</label>

                        <input
                            type="text"
                            name="color"
                            placeholder="e.g. Black"
                        >

                    </div>


                    <div class="form-group">

                        <label>Brand</label>

                        <input
                            type="text"
                            name="brand"
                            placeholder="e.g. Nike"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>Found Location</label>

                    <input
                        type="text"
                        name="location"
                        placeholder="e.g. College Library"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Date Found</label>

                    <input
                        type="date"
                        name="date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Upload Item Image</label>

                    <input
                        type="file"
                        name="image"
                        accept="image/*"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                >
                    Report Found Item
                </button>

            </form>

        </div>

    </section>



    <script src="config.js"></script>
    <script src="script.js"></script>

<script>
    const storedUser = localStorage.getItem("user");

    const navButtons = document.querySelector(".nav-buttons");

    if (storedUser && navButtons) {

        try {

            const user = JSON.parse(storedUser);

            if (user && user.id) {

                navButtons.innerHTML = `
                    <span class="user-welcome">
                        Hi, ${user.name} 👋
                    </span>

                    <a href="my-reports.html" class="login-btn">
                        My Reports
                    </a>

                    <a href="#" class="signup-btn" id="logoutBtn">
                        Logout
                    </a>
                `;

                document
                    .getElementById("logoutBtn")
                    .addEventListener("click", function (event) {

                        event.preventDefault();

                        localStorage.removeItem("user");

                        window.location.href = "index.html";

                    });

            }

        } catch (error) {

            console.error(
                "Invalid user data:",
                error
            );

            localStorage.removeItem("user");

        }

    }
</script>
</body>

</html>
