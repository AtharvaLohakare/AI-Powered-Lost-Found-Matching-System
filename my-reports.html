<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Reports | Lost & Found AI</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================================================
           MY REPORTS PAGE
        ========================================================= */

        .my-reports-page {
            min-height: calc(100vh - 80px);
            padding: 50px 30px 70px;
            background: #f5f7fb;
        }

        .reports-header {
            max-width: 1200px;
            margin: 0 auto 35px;
            text-align: center;
        }

        .reports-header h1 {
            margin: 0;
            color: #1f2937;
            font-size: 36px;
            font-weight: 700;
        }

        .reports-header p {
            margin: 10px 0 18px;
            color: #6b7280;
            font-size: 16px;
        }

        .reports-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 18px;
            border-radius: 20px;
            background: #e8edff;
            color: #3155d4;
            font-size: 14px;
            font-weight: 600;
        }

        .reports-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
            gap: 24px;
        }

        /* =========================================================
           REPORT CARD
        ========================================================= */

        .report-card {
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.07);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .report-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 32px rgba(15, 23, 42, 0.11);
        }

        .report-image-wrapper {
            position: relative;
            width: 100%;
            height: 230px;
            background: #eef1f5;
            overflow: hidden;
        }

        .report-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .report-image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            color: #9ca3af;
        }

        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-lost {
            background: #fee2e2;
            color: #b91c1c;
        }

        .status-found {
            background: #dcfce7;
            color: #15803d;
        }

        .report-content {
            padding: 22px;
        }

        .report-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 8px;
        }

        .report-title {
            margin: 0;
            color: #1f2937;
            font-size: 22px;
            font-weight: 700;
        }

        .report-description {
            margin: 0 0 20px;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }

        .report-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .info-box {
            padding: 11px 12px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #edf0f4;
        }

        .info-label {
            display: block;
            margin-bottom: 4px;
            color: #9ca3af;
            font-size: 11px;
            font-weight: 600;
        }

        .info-value {
            display: block;
            color: #374151;
            font-size: 13px;
            font-weight: 600;
            word-break: break-word;
        }

        .find-match-button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 13px 18px;
            background: #3155d4;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .find-match-button:hover {
            background: #2444ba;
            transform: translateY(-1px);
        }

        .find-match-button:disabled {
            opacity: 0.65;
            cursor: wait;
            transform: none;
        }

        .report-click-hint {
            margin: 13px 0 0;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }

        /* =========================================================
           EMPTY / ERROR STATES
        ========================================================= */

        .empty-reports {
            padding: 70px 25px;
            background: white;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            text-align: center;
        }

        .empty-reports-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty-reports h3 {
            margin: 0 0 8px;
            color: #1f2937;
            font-size: 22px;
        }

        .empty-reports p {
            margin: 0;
            color: #6b7280;
        }

        /* =========================================================
           AI MATCH MODAL
        ========================================================= */

        .match-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 25px;

            background: rgba(15, 23, 42, 0.62);
            backdrop-filter: blur(3px);
        }

        .match-modal.active {
            display: flex;
        }

        .match-modal-content {
            width: min(1050px, 100%);
            max-height: 90vh;
            overflow-y: auto;

            background: #ffffff;
            border-radius: 20px;

            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);

            animation: matchModalIn 0.2s ease;
        }

        @keyframes matchModalIn {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .match-modal-header {
            position: sticky;
            top: 0;
            z-index: 2;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 25px 30px;

            background: #ffffff;
            border-bottom: 1px solid #edf0f4;
        }

        .match-modal-title {
            display: flex;
            align-items: center;
            gap: 10px;

            margin: 0;

            color: #25324a;
            font-size: 28px;
            font-weight: 700;
        }

        .close-match-modal {
            width: 40px;
            height: 40px;

            border: none;
            border-radius: 50%;

            background: #f1f3f6;
            color: #111827;

            font-size: 18px;
            font-weight: 700;

            cursor: pointer;

            transition: background 0.2s ease;
        }

        .close-match-modal:hover {
            background: #e4e7eb;
        }

        .match-content {
            padding: 25px 30px 32px;
        }

        .match-results-info {
            margin-bottom: 25px;
            padding: 14px 18px;

            border-radius: 12px;

            background: #eef3ff;
            color: #3155d4;

            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
        }

        /* =========================================================
           MATCH LOADING
        ========================================================= */

        .match-loading {
            padding: 65px 20px;
            text-align: center;
        }

        .match-loading-icon {
            font-size: 55px;
            margin-bottom: 15px;
            animation: robotPulse 1.3s infinite ease-in-out;
        }

        @keyframes robotPulse {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        .match-loading h3 {
            margin: 0 0 8px;
            color: #1f2937;
        }

        .match-loading p {
            max-width: 520px;
            margin: 0 auto;
            color: #6b7280;
            line-height: 1.6;
        }

        /* =========================================================
           MATCH CARD - IMPROVED
        ========================================================= */

        .match-results {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .match-card {
            overflow: hidden;

            background: #ffffff;

            border: 1px solid #dfe4ec;
            border-radius: 18px;

            box-shadow: 0 7px 24px rgba(15, 23, 42, 0.07);
        }

        /*
            TOP AREA:
            Image + details
        */

        .match-card-main {
            display: grid;
            grid-template-columns: 180px minmax(0, 1fr);

            gap: 24px;

            padding: 22px;
        }

        .match-image-container {
            width: 180px;
            height: 180px;

            overflow: hidden;

            border-radius: 14px;

            background: #f1f3f6;
        }

        .match-image {
            width: 100%;
            height: 100%;

            object-fit: cover;
            display: block;
        }

        .match-image-placeholder {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 55px;
            color: #9ca3af;
        }

        .match-details {
            min-width: 0;
        }

        .match-details h3 {
            margin: 0 0 7px;

            color: #1f2937;

            font-size: 23px;
            font-weight: 700;
        }

        .match-description {
            margin: 0 0 16px;

            color: #6b7280;

            font-size: 14px;
            line-height: 1.6;
        }

        .match-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .match-meta span {
            display: inline-flex;
            align-items: center;

            padding: 7px 10px;

            border-radius: 8px;

            background: #f5f7fa;

            color: #5b6472;

            font-size: 12px;
            font-weight: 600;
        }

        /* =========================================================
           SCORE SECTION
        ========================================================= */

        .match-score-section {
            padding: 20px 22px;

            border-top: 1px solid #edf0f4;
            border-bottom: 1px solid #edf0f4;

            background: #fafbfc;
        }

        .match-score-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 10px;
        }

        .match-score-label {
            color: #4b5563;

            font-size: 14px;
            font-weight: 700;
        }

        .match-score {
            color: #3155d4;

            font-size: 25px;
            font-weight: 800;

            white-space: nowrap;
        }

        .score-bar {
            width: 100%;
            height: 9px;

            overflow: hidden;

            border-radius: 20px;

            background: #e4e8ef;
        }

        .score-fill {
            height: 100%;

            border-radius: inherit;

            background: linear-gradient(
                90deg,
                #3155d4,
                #5577e8
            );

            transition: width 0.5s ease;
        }

        .match-level {
            display: inline-block;

            margin-top: 11px;

            padding: 6px 11px;

            border-radius: 20px;

            background: #e9f0ff;
            color: #3155d4;

            font-size: 12px;
            font-weight: 700;
        }

        /* =========================================================
           REASONS SECTION
        ========================================================= */

        .match-reasons {
            padding: 20px 22px;
        }

        .match-reasons-title {
            display: block;

            margin-bottom: 12px;

            color: #25324a;

            font-size: 14px;
            font-weight: 700;
        }

        .match-reasons ul {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));

            gap: 9px 25px;

            margin: 0;
            padding: 0;

            list-style: none;
        }

        .match-reasons li {
            position: relative;

            padding-left: 22px;

            color: #5b6472;

            font-size: 13px;
            line-height: 1.5;
        }

        .match-reasons li::before {
            content: "✓";

            position: absolute;
            left: 0;
            top: 0;

            color: #15945a;

            font-weight: 800;
        }

        /* =========================================================
           CONTACT BUTTON
        ========================================================= */

        .match-actions {
            padding: 0 22px 22px;
        }

        .contact-reporter-button {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 14px 20px;

            border: none;
            border-radius: 11px;

            background: #168a50;
            color: #ffffff;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .contact-reporter-button:hover {
            background: #117443;
            transform: translateY(-1px);
        }

        /* =========================================================
           NO MATCH
        ========================================================= */

        .no-match {
            padding: 65px 25px;
            text-align: center;
        }

        .no-match-icon {
            margin-bottom: 15px;
            font-size: 55px;
        }

        .no-match h3 {
            margin: 0 0 10px;
            color: #1f2937;
        }

        .no-match p {
            max-width: 600px;
            margin: 7px auto;
            color: #6b7280;
            line-height: 1.6;
        }

        /* =========================================================
           NAVBAR USER
        ========================================================= */

        .user-welcome {
            display: inline-flex;
            align-items: center;

            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 800px) {

            .my-reports-page {
                padding: 35px 16px 55px;
            }

            .reports-header h1 {
                font-size: 30px;
            }

            .reports-grid {
                grid-template-columns: 1fr;
            }

            .match-modal {
                padding: 10px;
            }

            .match-modal-content {
                max-height: 94vh;
                border-radius: 16px;
            }

            .match-modal-header {
                padding: 20px;
            }

            .match-modal-title {
                font-size: 22px;
            }

            .match-content {
                padding: 18px;
            }

            .match-card-main {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .match-image-container {
                width: 100%;
                height: 220px;
            }

            .match-reasons ul {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {

            .report-info-grid {
                grid-template-columns: 1fr;
            }

            .report-image-wrapper {
                height: 200px;
            }

            .match-image-container {
                height: 190px;
            }

            .match-score-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .match-score {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         NAVBAR
    ========================================================= -->

    <nav class="navbar">

        <div class="logo">
            Lost & Found AI
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="items.html">Items</a>

            <a href="report-lost.html">Report Lost</a>

            <a href="report-found.html">Report Found</a>

            <a href="notifications.html" class="notification-link">
                🔔 Notifications
                <span id="navBadge" style="display:none;"></span>
            </a>

        </div>

        <div class="nav-buttons" id="navButtons">

            <a href="login.html" class="login-btn">
                Login
            </a>

            <a href="signup.html" class="signup-btn">
                Sign Up
            </a>

        </div>

    </nav>


    <!-- =========================================================
         MAIN
    ========================================================= -->

    <main class="my-reports-page">

        <header class="reports-header">

            <h1>My Reports</h1>

            <p>
                Manage and track the items you have reported.
            </p>

            <span class="reports-count" id="reportsCount">
                0 Reports
            </span>

        </header>


        <section class="reports-container">

            <div
                class="reports-grid"
                id="reportsContainer">
            </div>

        </section>

    </main>


    <!-- =========================================================
         AI MATCH MODAL
    ========================================================= -->

    <div
        class="match-modal"
        id="matchModal">

        <div class="match-modal-content">

            <div class="match-modal-header">

                <h2 class="match-modal-title">
                    🤖 AI Match Results
                </h2>

                <button
                    type="button"
                    class="close-match-modal"
                    id="closeMatchModal"
                    aria-label="Close">
                    ×
                </button>

            </div>

            <div
                class="match-content"
                id="matchContent">

                <!-- Results inserted here -->

            </div>

        </div>

    </div>


    <!-- =========================================================
         SCRIPTS
    ========================================================= -->

    <script src="config.js"></script>
    <script src="script.js"></script>


    <script>

        /* =========================================================
           BASIC HELPERS
        ========================================================= */

        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function getImageUrl(item) {

            if (!item || !item.image_url) {
                return "";
            }

            const imageUrl = String(item.image_url);

            if (
                imageUrl.startsWith("http://") ||
                imageUrl.startsWith("https://")
            ) {
                return imageUrl;
            }

            return `${API_URL}${imageUrl.startsWith("/") ? "" : "/"}${imageUrl}`;
        }


        function handleImageError(img) {

            if (!img) {
                return;
            }

            img.style.display = "none";

            const parent = img.parentElement;

            if (parent && !parent.querySelector(".report-image-placeholder")) {

                const placeholder = document.createElement("div");

                placeholder.className = "report-image-placeholder";

                placeholder.innerHTML = "📦";

                parent.appendChild(placeholder);
            }
        }


        /* =========================================================
           USER
        ========================================================= */

        function getLoggedInUser() {

            const storedUser = localStorage.getItem("user");

            if (!storedUser) {

                window.location.href = "login.html";

                return null;
            }

            try {

                const user = JSON.parse(storedUser);

                if (!user || !user.id) {

                    localStorage.removeItem("user");

                    window.location.href = "login.html";

                    return null;
                }

                return user;

            } catch (error) {

                console.error(
                    "Invalid user data:",
                    error
                );

                localStorage.removeItem("user");

                window.location.href = "login.html";

                return null;
            }
        }


        /* =========================================================
           NAVBAR
        ========================================================= */

        function setupNavbar(user) {

            const navButtons =
                document.getElementById("navButtons");

            if (!navButtons || !user) {
                return;
            }

            navButtons.innerHTML = `

                <span class="user-welcome">
                    Hi, ${escapeHtml(user.name || "User")} 👋
                </span>

                <a
                    href="my-reports.html"
                    class="login-btn">
                    My Reports
                </a>

                <a
                    href="#"
                    class="signup-btn"
                    id="logoutBtn">
                    Logout
                </a>

            `;


            const logoutBtn =
                document.getElementById("logoutBtn");

            if (logoutBtn) {

                logoutBtn.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();

                        localStorage.removeItem("user");

                        window.location.href =
                            "index.html";
                    }
                );
            }
        }


        /* =========================================================
           MODAL
        ========================================================= */

        function openMatchModal() {

            const modal =
                document.getElementById("matchModal");

            if (!modal) {
                return;
            }

            modal.classList.add("active");

            document.body.style.overflow = "hidden";
        }


        function closeMatchModal() {

            const modal =
                document.getElementById("matchModal");

            if (!modal) {
                return;
            }

            modal.classList.remove("active");

            document.body.style.overflow = "";
        }


        /* =========================================================
           FIND AI MATCH
        ========================================================= */

        async function findAIMatch(itemId, button) {

            const matchContent =
                document.getElementById("matchContent");

            if (!matchContent) {
                return;
            }


            openMatchModal();


            matchContent.innerHTML = `

                <div class="match-loading">

                    <div class="match-loading-icon">
                        🤖
                    </div>

                    <h3>
                        AI is searching for matches...
                    </h3>

                    <p>
                        Comparing descriptions, images,
                        category, color, brand,
                        location and date.
                    </p>

                </div>

            `;


            if (button) {
                button.disabled = true;
                button.textContent = "🤖 Finding Matches...";
            }


            try {

                const response = await fetch(
                    `${API_URL}/match/${encodeURIComponent(itemId)}`
                );


                if (!response.ok) {

                    let errorMessage =
                        `Unable to find matches. Server returned ${response.status}.`;

                    try {

                        const errorData =
                            await response.json();

                        if (errorData.detail) {
                            errorMessage =
                                errorData.detail;
                        }

                    } catch (error) {
                        // Ignore JSON parsing error
                    }

                    throw new Error(errorMessage);
                }


                const data =
                    await response.json();


                console.log(
                    "AI Match Response:",
                    data
                );


                displayMatchResults(data);


            } catch (error) {

                console.error(
                    "AI Match Error:",
                    error
                );


                matchContent.innerHTML = `

                    <div class="no-match">

                        <div class="no-match-icon">
                            ⚠️
                        </div>

                        <h3>
                            Unable to Find Matches
                        </h3>

                        <p>
                            ${escapeHtml(
                                error.message ||
                                "Something went wrong while searching for matches."
                            )}
                        </p>

                        <p>
                            Please try again later.
                        </p>

                    </div>

                `;

            } finally {

                if (button) {

                    button.disabled = false;

                    button.textContent =
                        "🤖 Find AI Match";
                }
            }
        }


        /* =========================================================
           DISPLAY AI MATCH RESULTS
        ========================================================= */

        function displayMatchResults(data) {

            const matchContent =
                document.getElementById("matchContent");

            if (!matchContent) {
                return;
            }


            const matches =
                Array.isArray(data?.matches)
                    ? data.matches
                    : [];


            if (matches.length === 0) {

                matchContent.innerHTML = `

                    <div class="no-match">

                        <div class="no-match-icon">
                            🔎
                        </div>

                        <h3>
                            No Strong Match Found
                        </h3>

                        <p>
                            ${escapeHtml(
                                data?.message ||
                                "The AI could not find a strong matching item yet."
                            )}
                        </p>

                        <p>
                            You can check again later
                            when more reports are added.
                        </p>

                    </div>

                `;

                return;
            }


            matchContent.innerHTML = `

                <div class="match-results-info">

                    🤖 Found
                    ${matches.length}
                    possible
                    ${escapeHtml(
                        data?.searching_for ||
                        "lost item"
                    )}
                    match${matches.length === 1 ? "" : "es"}.
                    Results are sorted by AI match score.

                </div>

                <div
                    class="match-results"
                    id="matchResultsContainer">
                </div>

            `;


            const resultsContainer =
                document.getElementById(
                    "matchResultsContainer"
                );


            if (!resultsContainer) {
                return;
            }


            matches.forEach(function (match) {

                const card =
                    createMatchCard(match);

                resultsContainer.appendChild(card);

            });
        }


        /* =========================================================
           CREATE MATCH CARD
        ========================================================= */

        function createMatchCard(match) {

            const score =
                Number(match?.match_score || 0);


            const safeScore =
                Math.max(
                    0,
                    Math.min(
                        score,
                        100
                    )
                );


            const matchedItemId =
                match?.item_id;


            let imageUrl = "";

            if (match?.image_url) {

                const rawImageUrl =
                    String(match.image_url);

                if (
                    rawImageUrl.startsWith("http://") ||
                    rawImageUrl.startsWith("https://")
                ) {

                    imageUrl =
                        rawImageUrl;

                } else {

                    imageUrl =
                        `${API_URL}${rawImageUrl.startsWith("/") ? "" : "/"}${rawImageUrl}`;
                }
            }


            const reasons =
                Array.isArray(match?.reasons)
                    ? match.reasons
                    : [];


            const card =
                document.createElement("div");

            card.className =
                "match-card";


            const reasonsHTML =
                reasons.length

                    ? reasons
                        .map(function (reason) {

                            return `
                                <li>
                                    ${escapeHtml(reason)}
                                </li>
                            `;

                        })
                        .join("")

                    : `
                        <li>
                            Possible match based on item details.
                        </li>
                    `;


            card.innerHTML = `

                <!-- ITEM INFORMATION -->

                <div class="match-card-main">

                    <div class="match-image-container">

                        ${
                            imageUrl

                                ? `

                                    <img
                                        src="${escapeHtml(imageUrl)}"
                                        class="match-image"
                                        alt="Matched item"
                                        onerror="this.style.display='none';"
                                    >

                                `

                                : `

                                    <div class="match-image-placeholder">
                                        📦
                                    </div>

                                `
                        }

                    </div>


                    <div class="match-details">

                        <h3>
                            ${escapeHtml(
                                match?.item_name ||
                                "Matched Item"
                            )}
                        </h3>


                        <p class="match-description">

                            ${escapeHtml(
                                match?.description ||
                                "No description available."
                            )}

                        </p>


                        <div class="match-meta">

                            <span>
                                📂
                                ${escapeHtml(
                                    match?.category ||
                                    "N/A"
                                )}
                            </span>

                            <span>
                                🎨
                                ${escapeHtml(
                                    match?.color ||
                                    "N/A"
                                )}
                            </span>

                            <span>
                                🏷️
                                ${escapeHtml(
                                    match?.brand ||
                                    "N/A"
                                )}
                            </span>

                            <span>
                                📍
                                ${escapeHtml(
                                    match?.location ||
                                    "N/A"
                                )}
                            </span>

                            ${
                                match?.distance_km !== null &&
                                match?.distance_km !== undefined

                                    ? `

                                        <span>
                                            📏
                                            ${escapeHtml(
                                                match.distance_km
                                            )}
                                            km
                                        </span>

                                    `

                                    : ""
                            }

                        </div>

                    </div>

                </div>


                <!-- SCORE -->

                <div class="match-score-section">

                    <div class="match-score-top">

                        <span class="match-score-label">
                            AI Match Score
                        </span>

                        <span class="match-score">
                            ${safeScore.toFixed(2)}%
                        </span>

                    </div>


                    <div class="score-bar">

                        <div
                            class="score-fill"
                            style="width: ${safeScore}%">
                        </div>

                    </div>


                    <span class="match-level">
                        ${getMatchLevel(safeScore)}
                    </span>

                </div>


                <!-- REASONS -->

                <div class="match-reasons">

                    <span class="match-reasons-title">
                        Why this may be a match:
                    </span>

                    <ul>
                        ${reasonsHTML}
                    </ul>

                </div>


                <!-- CONTACT -->

                <div class="match-actions">

                    <button
                        type="button"
                        class="contact-reporter-button">

                        💬 Contact Reporter

                    </button>

                </div>

            `;


            /* =====================================================
               CONTACT REPORTER
            ===================================================== */

            const contactButton =
                card.querySelector(
                    ".contact-reporter-button"
                );


            if (contactButton) {

                contactButton.addEventListener(
                    "click",
                    function () {

                        console.log(
                            "Matched item:",
                            match
                        );

                        console.log(
                            "Matched item ID:",
                            matchedItemId
                        );


                        if (!matchedItemId) {

                            alert(
                                "Unable to contact the reporter because the matched item ID is missing."
                            );

                            return;
                        }


                        /*
                            IMPORTANT:

                            The matched item's ID is passed to
                            the communication page.

                            Example:

                            messages.html?item_id=2
                        */

                        window.location.href =
                            `messages.html?item_id=${encodeURIComponent(
                                matchedItemId
                            )}`;

                    }
                );
            }


            return card;
        }


        /* =========================================================
           MATCH LEVEL
        ========================================================= */

        function getMatchLevel(score) {

            if (score >= 80) {
                return "Very High Match";
            }

            if (score >= 65) {
                return "High Match";
            }

            if (score >= 50) {
                return "Possible Match";
            }

            return "Low Match";
        }


        /* =========================================================
           LOAD MY REPORTS
        ========================================================= */

        async function loadMyReports(user) {

            const reportsContainer =
                document.getElementById(
                    "reportsContainer"
                );


            const reportsCount =
                document.getElementById(
                    "reportsCount"
                );


            if (!reportsContainer) {
                return;
            }


            reportsContainer.innerHTML = `

                <div class="empty-reports">

                    <div class="empty-reports-icon">
                        ⏳
                    </div>

                    <h3>
                        Loading your reports...
                    </h3>

                    <p>
                        Please wait.
                    </p>

                </div>

            `;


            try {

                const response =
                    await fetch(
                        `${API_URL}/my-items/${encodeURIComponent(user.id)}`
                    );


                if (!response.ok) {

                    let errorMessage =
                        `Unable to load reports. Server returned ${response.status}.`;

                    try {

                        const errorData =
                            await response.json();

                        if (errorData.detail) {
                            errorMessage =
                                errorData.detail;
                        }

                    } catch (error) {
                        // Ignore JSON parsing error
                    }

                    throw new Error(errorMessage);
                }


                const items =
                    await response.json();


                console.log(
                    "My Reports:",
                    items
                );


                if (!Array.isArray(items)) {

                    throw new Error(
                        "Invalid reports data received from server."
                    );
                }


                reportsCount.textContent =
                    `${items.length} Report${items.length === 1 ? "" : "s"}`;


                if (items.length === 0) {

                    reportsContainer.innerHTML = `

                        <div class="empty-reports">

                            <div class="empty-reports-icon">
                                📦
                            </div>

                            <h3>
                                No Reports Yet
                            </h3>

                            <p>
                                You have not reported any
                                lost or found items yet.
                            </p>

                        </div>

                    `;

                    return;
                }


                reportsContainer.innerHTML = "";


                items.forEach(function (item) {

                    const article =
                        document.createElement(
                            "article"
                        );

                    article.className =
                        "report-card";


                    const isLost =
                        String(
                            item.item_type || ""
                        ).toLowerCase() === "lost";


                    const imageUrl =
                        getImageUrl(item);


                    article.innerHTML = `

                        <div class="report-image-wrapper">

                            ${
                                imageUrl

                                    ? `

                                        <img
                                            src="${escapeHtml(imageUrl)}"
                                            class="report-image"
                                            alt="${escapeHtml(
                                                item.item_name ||
                                                "Reported item"
                                            )}"
                                        >

                                    `

                                    : `

                                        <div class="report-image-placeholder">
                                            📦
                                        </div>

                                    `
                            }


                            <span
                                class="
                                    status-badge
                                    ${
                                        isLost
                                            ? "status-lost"
                                            : "status-found"
                                    }
                                ">

                                ${
                                    isLost
                                        ? "LOST"
                                        : "FOUND"
                                }

                            </span>

                        </div>


                        <div class="report-content">

                            <div class="report-title-row">

                                <h2 class="report-title">

                                    ${escapeHtml(
                                        item.item_name ||
                                        "Unnamed Item"
                                    )}

                                </h2>

                            </div>


                            <p class="report-description">

                                ${escapeHtml(
                                    item.description ||
                                    "No description available."
                                )}

                            </p>


                            <div class="report-info-grid">

                                <div class="info-box">

                                    <span class="info-label">
                                        📍 Location
                                    </span>

                                    <span class="info-value">

                                        ${escapeHtml(
                                            item.location ||
                                            "N/A"
                                        )}

                                    </span>

                                </div>


                                <div class="info-box">

                                    <span class="info-label">
                                        📅 Date
                                    </span>

                                    <span class="info-value">

                                        ${escapeHtml(
                                            item.item_date ||
                                            "N/A"
                                        )}

                                    </span>

                                </div>


                                <div class="info-box">

                                    <span class="info-label">
                                        🎨 Color
                                    </span>

                                    <span class="info-value">

                                        ${escapeHtml(
                                            item.color ||
                                            "N/A"
                                        )}

                                    </span>

                                </div>


                                <div class="info-box">

                                    <span class="info-label">
                                        🏷️ Brand
                                    </span>

                                    <span class="info-value">

                                        ${escapeHtml(
                                            item.brand ||
                                            "N/A"
                                        )}

                                    </span>

                                </div>

                            </div>


                            <button
                                type="button"
                                class="find-match-button">

                                🤖 Find AI Match

                            </button>


                            <p class="report-click-hint">

                                Click the button to find possible matching reports.

                            </p>

                        </div>

                    `;


                    const image =
                        article.querySelector(
                            ".report-image"
                        );


                    if (image) {

                        image.addEventListener(
                            "error",
                            function () {

                                handleImageError(
                                    image
                                );

                            }
                        );
                    }


                    const matchButton =
                        article.querySelector(
                            ".find-match-button"
                        );


                    if (matchButton) {

                        matchButton.addEventListener(
                            "click",
                            function () {

                                findAIMatch(
                                    item.id,
                                    matchButton
                                );

                            }
                        );
                    }


                    reportsContainer.appendChild(
                        article
                    );

                });


            } catch (error) {

                console.error(
                    "Load My Reports Error:",
                    error
                );


                reportsContainer.innerHTML = `

                    <div class="empty-reports">

                        <div class="empty-reports-icon">
                            ⚠️
                        </div>

                        <h3>
                            Unable to Load Reports
                        </h3>

                        <p>
                            ${escapeHtml(
                                error.message ||
                                "Something went wrong while loading your reports."
                            )}
                        </p>

                    </div>

                `;


                reportsCount.textContent =
                    "0 Reports";
            }
        }


        /* =========================================================
           DOM READY
        ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const user =
                    getLoggedInUser();


                if (!user) {
                    return;
                }


                setupNavbar(user);

                loadMyReports(user);


                /* Close button */

                const closeButton =
                    document.getElementById(
                        "closeMatchModal"
                    );


                if (closeButton) {

                    closeButton.addEventListener(
                        "click",
                        closeMatchModal
                    );
                }


                /* Click outside modal */

                const modal =
                    document.getElementById(
                        "matchModal"
                    );


                if (modal) {

                    modal.addEventListener(
                        "click",
                        function (event) {

                            if (
                                event.target === modal
                            ) {

                                closeMatchModal();

                            }

                        }
                    );
                }


                /* ESC key */

                document.addEventListener(
                    "keydown",
                    function (event) {

                        if (
                            event.key === "Escape"
                        ) {

                            closeMatchModal();

                        }

                    }
                );

            }
        );

    </script>

</body>

</html>
