<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Reports - Lost & Found AI</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .reports-page {
            padding: 120px 8% 60px;
            min-height: 100vh;
        }

        .reports-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .reports-header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .reports-header p {
            color: #777;
            font-size: 17px;
        }

        .reports-count {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 18px;
            border-radius: 20px;
            background: #f1f5ff;
            color: #3157d5;
            font-weight: 600;
        }

        .reports-grid {
            max-width: 1100px;
            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(auto-fit,
                    minmax(320px, 1fr));

            gap: 25px;
        }

        .report-card {
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.08);

            border: 1px solid #eeeeee;

            transition: 0.25s ease;

            cursor: pointer;
        }

        .report-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 14px 35px rgba(0, 0, 0, 0.12);
        }

        .report-image-container {
            width: 100%;
            height: 220px;

            background: #f4f4f4;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .report-image {
            width: 100%;
            height: 220px;

            object-fit: cover;

            display: block;
        }

        .image-placeholder {
            width: 100%;
            height: 220px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 8px;

            font-size: 50px;

            background: #f5f6f8;
            color: #777;
        }

        .image-placeholder span {
            font-size: 13px;
        }

        .report-content {
            padding: 22px;
        }

        .report-top {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 10px;

            margin-bottom: 12px;
        }

        .report-title {
            font-size: 23px;
            margin: 0;
        }

        .status-badge {
            padding: 6px 12px;

            border-radius: 20px;

            font-size: 12px;
            font-weight: 700;

            text-transform: uppercase;
        }

        .status-lost {
            background: #ffe8e8;
            color: #d63031;
        }

        .status-found {
            background: #e5f8ed;
            color: #16804b;
        }

        .report-description {
            color: #666;

            line-height: 1.6;

            margin: 12px 0 18px;
        }

        .report-info {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-top: 15px;
        }

        .info-box {
            background: #f8f9fb;

            padding: 12px;

            border-radius: 10px;
        }

        .info-label {
            display: block;

            font-size: 12px;

            color: #888;

            margin-bottom: 4px;
        }

        .info-value {
            font-size: 14px;

            font-weight: 600;

            color: #333;
        }

        .click-hint {
            margin-top: 18px;

            padding-top: 14px;

            border-top: 1px solid #eeeeee;

            color: #3157d5;

            font-size: 13px;

            font-weight: 600;

            text-align: center;
        }

        .empty-state {
            max-width: 600px;

            margin: 60px auto;

            text-align: center;

            background: white;

            padding: 50px 30px;

            border-radius: 20px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.07);
        }

        .empty-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty-state h2 {
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #777;
            margin-bottom: 25px;
        }

        .report-button {
            display: inline-block;

            padding: 12px 22px;

            border-radius: 10px;

            text-decoration: none;

            background: #3157d5;
            color: white;

            font-weight: 600;

            border: none;

            cursor: pointer;
        }

        .loading-state {
            max-width: 600px;

            margin: 60px auto;

            text-align: center;

            padding: 40px;
        }

        .loading-state h2 {
            margin-bottom: 10px;
        }

        .loading-state p {
            color: #777;
        }

        /* =====================================================
           NAVBAR USER
        ===================================================== */

        .user-welcome {
            font-size: 15px;
            font-weight: 600;
            color: #1e3a8a;
            white-space: nowrap;
        }

        @media (max-width: 900px) {

            .user-welcome {
                font-size: 14px;
            }
        }

        @media (max-width: 600px) {

            .reports-page {
                padding: 100px 20px 40px;
            }

            .reports-header h1 {
                font-size: 32px;
            }

            .report-info {
                grid-template-columns: 1fr;
            }

            .report-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .user-welcome {
                font-size: 14px;
            }
        }
    </style>
</head>


<body>

    <!-- =====================================================
     NAVBAR
===================================================== -->

    <nav class="navbar">

        <div class="logo">
            Lost & Found AI
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="items.html">
                Items
            </a>

            <a href="report-lost.html">
                Report Lost
            </a>

            <a href="report-found.html">
                Report Found
            </a>

            <a href="notifications.html">
                🔔 Notifications
                <span id="navBadge">0</span>
            </a>
        </div>


        <div class="nav-buttons">

            <span class="user-welcome" id="userWelcome"></span>


            <a href="my-reports.html" class="login-btn">
                My Reports
            </a>


            <a href="#" class="signup-btn" id="logoutBtn">
                Logout
            </a>

        </div>

    </nav>


    <!-- =====================================================
     MAIN
===================================================== -->

    <main class="reports-page">


        <div class="reports-header">

            <h1>
                My Reports
            </h1>

            <p>
                Manage and track the items you have reported.
            </p>

            <span class="reports-count" id="reportsCount">
                Loading reports...
            </span>

        </div>


        <div id="reports-container" class="reports-grid">

            <div class="loading-state">

                <h2>
                    Loading...
                </h2>

                <p>
                    Fetching your reports.
                </p>

            </div>

        </div>

    </main>


    <!-- =====================================================
     CONFIG
===================================================== -->

    <script src="config.js"></script>


    <script>

        // =====================================================
        // ESCAPE HTML
        // =====================================================

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {
                return "";
            }

            const div =
                document.createElement("div");

            div.textContent =
                String(value);

            return div.innerHTML;
        }


        // =====================================================
        // IMAGE URL
        // =====================================================

        function getImageUrl(item) {

            if (
                item &&
                item.image_url
            ) {

                let url = item.image_url;

                /*
                 * If backend returns a relative URL,
                 * convert it to the Render backend URL.
                 */

                if (
                    url.startsWith("/")
                ) {

                    return `${API_URL}${url}`;
                }

                return url;
            }


            if (
                !item ||
                !item.image_name
            ) {

                return "";
            }


            return `${API_URL}/uploads/${encodeURIComponent(
                item.image_name
            )}`;
        }


        // =====================================================
        // IMAGE ERROR
        // =====================================================

        function handleImageError(img) {

            img.onerror = null;

            const container =
                img.parentElement;

            if (!container) {
                return;
            }

            container.innerHTML = `
            <div class="image-placeholder">

                📦

                <span>
                    Image unavailable
                </span>

            </div>
        `;
        }


        // =====================================================
        // GET LOGGED-IN USER
        // =====================================================

        function getLoggedInUser() {

            const storedUser =
                localStorage.getItem("user");


            if (!storedUser) {

                window.location.href =
                    "login.html";

                return null;
            }


            try {

                const user =
                    JSON.parse(storedUser);


                if (
                    !user ||
                    !user.id
                ) {

                    throw new Error(
                        "Invalid user information."
                    );
                }


                return user;

            }
            catch (error) {

                console.error(
                    "Invalid user data:",
                    error
                );

                localStorage.removeItem(
                    "user"
                );

                window.location.href =
                    "login.html";

                return null;
            }
        }


        // =====================================================
        // SET USER NAVBAR
        // =====================================================

        function setupNavbar(user) {

            const userWelcome =
                document.getElementById(
                    "userWelcome"
                );

            const logoutBtn =
                document.getElementById(
                    "logoutBtn"
                );


            if (userWelcome) {

                userWelcome.textContent =
                    `Hi, ${user.name || "User"} 👋`;
            }


            if (logoutBtn) {

                logoutBtn.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();


                        localStorage.removeItem(
                            "user"
                        );


                        window.location.href =
                            "index.html";
                    }
                );
            }
        }


        // =====================================================
        // LOAD MY REPORTS
        // =====================================================

        async function loadMyReports(user) {

            const container =
                document.getElementById(
                    "reports-container"
                );


            const count =
                document.getElementById(
                    "reportsCount"
                );


            try {

                const url =
                    `${API_URL}/my-items/${encodeURIComponent(
                        user.id
                    )}`;


                console.log(
                    "Fetching:",
                    url
                );


                const response =
                    await fetch(url);


                let items = null;


                try {

                    items =
                        await response.json();

                }
                catch {

                    items = null;
                }


                console.log(
                    "Reports received:",
                    items
                );


                if (!response.ok) {

                    throw new Error(
                        items?.detail ||
                        items?.message ||
                        "Could not load reports."
                    );
                }


                if (
                    !Array.isArray(items)
                ) {

                    throw new Error(
                        "Invalid reports data received from server."
                    );
                }


                count.textContent =
                    `${items.length} Report${items.length === 1
                        ? ""
                        : "s"
                    }`;


                // =================================================
                // EMPTY
                // =================================================

                if (
                    items.length === 0
                ) {

                    container.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            📦
                        </div>

                        <h2>
                            No Reports Yet
                        </h2>

                        <p>
                            You haven't reported
                            any lost or found items yet.
                        </p>

                        <a
                            href="report-lost.html"
                            class="report-button"
                        >
                            Report an Item
                        </a>

                    </div>

                `;

                    return;
                }


                container.innerHTML = "";


                // =================================================
                // CREATE REPORT CARDS
                // =================================================

                items.forEach(function (item) {

                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "report-card";


                    card.addEventListener(
                        "click",
                        function () {

                            window.location.href =
                                `item-detail.html?id=${encodeURIComponent(
                                    item.id
                                )}`;
                        }
                    );


                    const isLost =
                        String(
                            item.item_type || ""
                        ).toLowerCase() === "lost";


                    const status =
                        isLost
                            ? "Lost"
                            : "Found";


                    const statusClass =
                        isLost
                            ? "status-lost"
                            : "status-found";


                    // =================================================
                    // IMAGE
                    // =================================================

                    const imageUrl =
                        getImageUrl(item);


                    let imageHTML;


                    if (imageUrl) {

                        imageHTML = `

                        <div
                            class="report-image-container"
                        >

                            <img
                                class="report-image"
                                src="${escapeHtml(
                            imageUrl
                        )}"
                                alt="${escapeHtml(
                            item.item_name
                        )}"
                                onerror="handleImageError(this)"
                            >

                        </div>

                    `;

                    }
                    else {

                        imageHTML = `

                        <div
                            class="report-image-container"
                        >

                            <div
                                class="image-placeholder"
                            >

                                📦

                                <span>
                                    No image available
                                </span>

                            </div>

                        </div>

                    `;
                    }


                    // =================================================
                    // CARD
                    // =================================================

                    card.innerHTML = `

                    ${imageHTML}


                    <div class="report-content">


                        <div class="report-top">

                            <h2 class="report-title">

                                ${escapeHtml(
                        item.item_name ||
                        "Unnamed Item"
                    )}

                            </h2>


                            <span
                                class="status-badge ${statusClass}"
                            >

                                ${status}

                            </span>

                        </div>


                        <p class="report-description">

                            ${escapeHtml(
                        item.description ||
                        "No description"
                    )}

                        </p>


                        <div class="report-info">


                            <div class="info-box">

                                <span class="info-label">
                                    📍 Location
                                </span>

                                <span class="info-value">

                                    ${escapeHtml(
                        item.location ||
                        "Not specified"
                    )}

                                </span>

                            </div>


                            <div class="info-box">

                                <span class="info-label">
                                    📅 Date
                                </span>

                                <span class="info-value">

                                    ${escapeHtml(
                        item.item_date ||
                        "Not specified"
                    )}

                                </span>

                            </div>


                            <div class="info-box">

                                <span class="info-label">
                                    🎨 Color
                                </span>

                                <span class="info-value">

                                    ${escapeHtml(
                        item.color ||
                        "Not specified"
                    )}

                                </span>

                            </div>


                            <div class="info-box">

                                <span class="info-label">
                                    🏷️ Brand
                                </span>

                                <span class="info-value">

                                    ${escapeHtml(
                        item.brand ||
                        "Not specified"
                    )}

                                </span>

                            </div>


                        </div>


                        <div class="click-hint">

                            Click to view full details →

                        </div>


                    </div>

                `;


                    container.appendChild(
                        card
                    );

                });

            }


            catch (error) {

                console.error(
                    "My Reports Error:",
                    error
                );


                count.textContent =
                    "Error";


                container.innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h2>
                        Could Not Load Reports
                    </h2>

                    <p>
                        ${escapeHtml(
                    error.message ||
                    "Something went wrong while loading your reports."
                )}
                    </p>

                    <button
                        class="report-button"
                        onclick="location.reload()"
                    >
                        Try Again
                    </button>

                </div>

            `;
            }
        }


        // =====================================================
        // PAGE START
        // =====================================================

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const user =
                    getLoggedInUser();


                if (!user) {
                    return;
                }


                setupNavbar(user);


                loadMyReports(user);

            }
        );

    </script>

</body>

</html>
