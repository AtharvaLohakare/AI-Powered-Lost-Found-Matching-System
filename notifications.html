<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications | Lost & Found AI</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="notifications.css">

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav class="navbar">

        <div class="logo">
            Lost & Found AI
        </div>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
            ☰
        </button>

        <div class="nav-menu" id="navMenu">

            <div class="nav-links">

                <a href="index.html">Home</a>

                <a href="items.html">Items</a>

                <a href="report-lost.html">
                    Report Lost
                </a>

                <a href="report-found.html">
                    Report Found
                </a>

                <a href="community.html">
                    Community
                </a>

                <a href="notifications.html" class="notification-link active"> 🔔 Notifications <span id="navBadge"
                        class="nav-notification-badge" style="display: none;"> 0 </span> </a>

            </div>

            <div class="nav-buttons">

                <a href="login.html" class="login-btn">
                    Login
                </a>

                <a href="signup.html" class="signup-btn">
                    Sign Up
                </a>

            </div>

        </div>

    </nav>



    <!-- =====================================================
         NOTIFICATIONS PAGE
    ====================================================== -->

    <main class="notifications-page">


        <!-- =================================================
             PAGE HEADER
        ================================================== -->

        <section class="notifications-hero">

            <div class="notifications-title">

                <span class="notifications-eyebrow">
                    ACTIVITY CENTER
                </span>

                <h1>
                    Notifications
                </h1>

                <p id="notificationSummary">
                    Loading notifications...
                </p>

            </div>


            <div class="notification-actions">

                <button id="markAllBtn" class="mark-all-btn" type="button">

                    ✓ Mark all as read

                </button>


                <button id="deleteAllBtn" class="delete-all-btn" type="button">

                    🗑️ Delete all

                </button>

            </div>

        </section>



        <!-- =================================================
             NOTIFICATION LIST
        ================================================== -->

        <section class="notifications-container">

            <div id="notificationList" class="notification-list">

            </div>

        </section>


    </main>



    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <!-- =====================================================
         DELETE CONFIRMATION MODAL
    ====================================================== -->

    <div id="deleteConfirmModal" class="confirm-modal">

        <div class="confirm-modal-overlay"></div>

        <div class="confirm-modal-box">

            <div class="confirm-modal-icon">
                🗑️
            </div>

            <h3 id="confirmModalTitle">
                Delete Notification?
            </h3>

            <p id="confirmModalMessage">
                Are you sure you want to delete this notification?
                This action cannot be undone.
            </p>

            <div class="confirm-modal-actions">

                <button type="button" id="confirmCancelBtn" class="confirm-cancel-btn">
                    Cancel
                </button>

                <button type="button" id="confirmDeleteBtn" class="confirm-delete-btn">
                    🗑️ Delete
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script src="config.js"></script>
    <script src="notifications.js"></script>

</body>

</html>
