<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Notifications | Lost & Found AI</title>

    <link
        rel="stylesheet"
        href="style.css">

    <link
        rel="stylesheet"
        href="notifications.css">

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav class="navbar">

        <div class="logo">
            Lost & Found AI
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="items.html">
                Items
            </a>

            <a href="report-lost.html">
                Report Lost
            </a>

            <a href="report-found.html">
                Report Found
            </a>

            <a href="my-reports.html">
                My Reports
            </a>

            <a href="community.html">
                Community
            </a>

            <a
                href="notifications.html"
                class="notification-link active">

                🔔 Notifications

                <span
                    id="navBadge"
                    class="nav-notification-badge"
                    style="display: none;">

                    0

                </span>

            </a>

        </div>


        <div
            class="nav-buttons"
            id="navButtons">

        </div>

    </nav>



    <!-- =====================================================
         NOTIFICATIONS PAGE
    ====================================================== -->

    <main class="notifications-page">


        <!-- =================================================
             PAGE HEADER
        ================================================== -->

        <section class="notifications-hero">

            <div class="notifications-title">

                <span class="notifications-eyebrow">
                    ACTIVITY CENTER
                </span>

                <h1>
                    Notifications
                </h1>

                <p id="notificationSummary">
                    Loading notifications...
                </p>

            </div>


            <div class="notification-actions">

                <button
                    id="markAllBtn"
                    class="mark-all-btn"
                    type="button">

                    ✓ Mark all as read

                </button>


                <button
                    id="deleteAllBtn"
                    class="delete-all-btn"
                    type="button">

                    🗑️ Delete all

                </button>

            </div>

        </section>



        <!-- =================================================
             NOTIFICATION LIST
        ================================================== -->

        <section class="notifications-container">

            <div
                id="notificationList"
                class="notification-list">

            </div>

        </section>


    </main>



    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script src="config.js"></script>

    <script src="notifications.js"></script>


</body>

</html>
