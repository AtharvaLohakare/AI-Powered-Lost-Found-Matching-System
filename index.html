<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Powered Lost and Found Matcher</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo"> Lost & Found AI </div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="items.html">Items</a>
            <a href="report-lost.html">Report Lost</a>
            <a href="report-found.html">Report Found</a>
            <a href="community.html">
    Community
</a>
            <a href="notifications.html">
    🔔 Notifications
    <span id="navBadge">0</span>
</a>

        </div>
        <div class="nav-buttons">
            <a href="login.html" class="login-btn">Login</a>
            <a href="signup.html" class="signup-btn">Sign Up</a>
        </div>
    </nav>

    <section class="home">

        <div class="home-content">

            <h1>Find What You Lost.<br>Return What You Found.</h1>

            <p>
                An AI-powered platform that helps people find lost items
                by intelligently matching lost and found reports.
            </p>

            <div class="home-buttons">
                <a href="report-lost.html" class="lost-btn">Report Lost Item</a>
                <a href="report-found.html" class="found-btn">Report Found Item</a>
            </div>

        </div>

    </section>

    <script src="script.js"></script>
    <script src="config.js"></script>

    <!-- Login / Signup UI -->
    <script>
        const navButtons = document.querySelector(".nav-buttons");

        const storedUser = localStorage.getItem("user");

        if (storedUser && navButtons) {

            try {
                const user = JSON.parse(storedUser);

                if (user && user.id) {

                    navButtons.innerHTML = `
                    <span class="user-welcome">Hi, ${user.name} 👋</span>
                    <a href="my-reports.html" class="login-btn">My Reports</a>
                    <a href="#" class="signup-btn" id="logoutBtn">Logout</a>
                `;

                    document.getElementById("logoutBtn").addEventListener("click", function (event) {
                        event.preventDefault();

                        localStorage.removeItem("user");

                        window.location.reload();
                    });
                }

            } catch (error) {
                console.error("Invalid user data:", error);
                localStorage.removeItem("user");
            }
        }
    </script>


</body>

</html>
