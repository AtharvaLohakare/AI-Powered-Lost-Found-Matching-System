<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lost & Found Items</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            Lost & Found AI
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="items.html">
                Items
            </a>

            <a href="report-lost.html">
                Report Lost
            </a>

            <a href="report-found.html">
                Report Found
            </a>

        </div>


        <div class="nav-buttons">
            <a href="login.html" class="login-btn">Login</a>
            <a href="signup.html" class="signup-btn">Sign Up</a>
        </div>

    </nav>


    <!-- ITEMS SECTION -->

    <section class="items-section">


        <div class="items-header">

            <h1>
                Lost & Found Items
            </h1>


            <p>
                Browse reported lost and found items.
            </p>

        </div>


        <!-- ITEMS WILL BE LOADED HERE -->

        <div
            id="items-container"
            class="items-container"
        >

            <p>
                Loading items...
            </p>

        </div>


    </section>


    <!-- CONFIG MUST LOAD BEFORE ITEMS.JS -->

    <script src="config.js"></script>


    <!-- ITEMS JAVASCRIPT -->

    <script src="items.js"></script>
<script>
    const storedUser = localStorage.getItem("user");

    const navButtons = document.querySelector(".nav-buttons");

    if (storedUser && navButtons) {

        try {

            const user = JSON.parse(storedUser);

            if (user && user.id) {

                navButtons.innerHTML = `
                    <span class="user-welcome">
                        Hi, ${user.name} 👋
                    </span>

                    <a href="my-reports.html" class="login-btn">
                        My Reports
                    </a>

                    <a href="#" class="signup-btn" id="logoutBtn">
                        Logout
                    </a>
                `;

                document
                    .getElementById("logoutBtn")
                    .addEventListener("click", function (event) {

                        event.preventDefault();

                        localStorage.removeItem("user");

                        window.location.href = "index.html";

                    });
            }

        } catch (error) {

            console.error(
                "Invalid user data:",
                error
            );

            localStorage.removeItem("user");

        }

    }
</script>

</body>

</html>
